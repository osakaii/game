<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1f2a" />
    <title>Mecha</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <span id="status" data-state="connecting">connecting…</span>
      <span id="ping"></span>
      <span id="fps"></span>
    </div>

    <div id="joystick" hidden><div id="joystick-knob"></div></div>
    <button id="jump-button" type="button" aria-label="Прыжок">JUMP</button>
    <div id="desktop-hint">WASD — ходить · тянуть мышью — камера · Space — прыжок</div>

    <details id="room-panel" open hidden>
      <summary>
        <span>Комната <b id="room-panel-code"></b></span>
        <span id="room-panel-count"></span>
      </summary>
      <ul id="player-list"></ul>
      <button type="button" id="start-game" class="primary" hidden>Начать игру</button>
      <div class="room-actions">
        <button type="button" id="invite">Пригласить</button>
        <button type="button" id="leave-room" class="danger">Выйти</button>
      </div>
    </details>

    <div id="phase-banner" hidden></div>

    <div id="blind" class="overlay" hidden>
      <div class="blind-content">
        <p>Ты ищешь. Закрой глаза — все прячутся</p>
        <div id="blind-timer"></div>
      </div>
    </div>

    <div id="results" class="overlay" hidden>
      <div class="card results-card">
        <h2 id="results-title"></h2>
        <p id="results-reason"></p>
        <p id="results-timer"></p>
      </div>
    </div>

    <div id="menu" class="overlay">
      <form id="menu-form" class="card" novalidate>
        <h1>MECHA</h1>
        <p class="subtitle">прятки с красками</p>

        <label class="field">
          <span>Ник</span>
          <input id="nickname" maxlength="16" autocomplete="nickname" enterkeyhint="done" placeholder="Как тебя зовут?" />
        </label>

        <button type="button" id="create-room" class="primary" disabled>Создать комнату</button>

        <div class="divider"><span>или</span></div>

        <div class="join-row">
          <input
            id="room-code"
            placeholder="КОД"
            autocapitalize="characters"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
          />
          <button type="submit" id="join-room" disabled>Войти</button>
        </div>

        <p id="menu-error" role="alert"></p>
      </form>
    </div>

    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
