<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1b1f2a" />
    <meta name="description" content="Мультиплеерные прятки с красками в браузере" />
    <!-- PWA: «Добавить на главный экран» откроет игру без адресной строки -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- iOS не читает иконки из манифеста, ему нужен свой тег и свои мета-теги -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mecha</title>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="hud">
      <span id="status" data-state="connecting">connecting…</span>
      <span id="ping"></span>
      <span id="fps"></span>
    </div>

    <div id="joystick" hidden><div id="joystick-knob"></div></div>
    <button id="jump-button" type="button" aria-label="Прыжок">JUMP</button>
    <div id="desktop-hint">WASD — ходить · тянуть мышью — камера · Space — прыжок</div>

    <details id="room-panel" open hidden>
      <summary>
        <span>Комната <b id="room-panel-code"></b></span>
        <span id="room-panel-count"></span>
      </summary>
      <button type="button" id="room-settings-summary" class="settings-summary"></button>
      <ul id="player-list"></ul>
      <button type="button" id="start-game" class="primary" hidden>Начать игру</button>
      <div class="room-actions">
        <button type="button" id="invite">Пригласить</button>
        <button type="button" id="leave-room" class="danger">Выйти</button>
      </div>
      <button type="button" id="sound-toggle-room" class="sound-room">Звук: вкл</button>
    </details>

    <button type="button" id="paint-toggle" hidden>Краска</button>
    <div id="paint-panel" hidden>
      <div class="paint-tools">
        <span id="paint-current" title="Текущий цвет"></span>
        <button type="button" id="paint-pick">Пипетка</button>
      </div>
      <div id="paint-recent"></div>
      <div class="body-figure" aria-label="Зоны тела">
        <button type="button" data-zone="head" class="zone zone-head" aria-label="Голова"></button>
        <div class="figure-row">
          <button type="button" data-zone="armRight" class="zone zone-arm" aria-label="Правая рука"></button>
          <button type="button" data-zone="torso" class="zone zone-torso" aria-label="Туловище"></button>
          <button type="button" data-zone="armLeft" class="zone zone-arm" aria-label="Левая рука"></button>
        </div>
        <div class="figure-row">
          <button type="button" data-zone="legRight" class="zone zone-leg" aria-label="Правая нога"></button>
          <button type="button" data-zone="legLeft" class="zone zone-leg" aria-label="Левая нога"></button>
        </div>
      </div>
      <button type="button" id="paint-all">Покрасить всё</button>
    </div>
    <div id="pick-hint" hidden>Коснись предмета, чтобы взять его цвет</div>

    <div id="phase-banner" hidden></div>
    <div id="seek-hint" hidden></div>

    <div id="blind" class="overlay" hidden>
      <div class="blind-content">
        <p>Ты ищешь. Закрой глаза — все прячутся</p>
        <div id="blind-timer"></div>
      </div>
    </div>

    <div id="results" class="overlay" hidden>
      <div class="card results-card">
        <h2 id="results-title"></h2>
        <p id="results-reason"></p>
        <ol id="results-scores"></ol>
        <p id="results-timer"></p>
      </div>
    </div>

    <div id="settings" class="overlay" hidden>
      <form id="settings-form" class="card" novalidate>
        <h2>Настройки комнаты</h2>
        <label class="field">
          <span>Карта</span>
          <select name="mapId"></select>
        </label>
        <label class="field">
          <span>Время на прятки</span>
          <select name="hideSeconds"></select>
        </label>
        <label class="field">
          <span>Время на поиск</span>
          <select name="seekSeconds"></select>
        </label>
        <label class="field">
          <span>Ищущих</span>
          <select name="seekers"></select>
        </label>
        <p class="settings-note" id="settings-note"></p>
        <button type="button" id="settings-close" class="primary">Готово</button>
      </form>
    </div>

    <div id="menu" class="overlay">
      <form id="menu-form" class="card" novalidate>
        <h1>MECHA</h1>
        <p class="subtitle">прятки с красками</p>

        <label class="field">
          <span>Ник</span>
          <input id="nickname" maxlength="16" autocomplete="nickname" enterkeyhint="done" placeholder="Как тебя зовут?" />
        </label>

        <button type="button" id="create-room" class="primary" disabled>Создать комнату</button>

        <div class="divider"><span>или</span></div>

        <div class="join-row">
          <input
            id="room-code"
            placeholder="КОД"
            autocapitalize="characters"
            autocomplete="off"
            autocorrect="off"
            spellcheck="false"
            enterkeyhint="go"
          />
          <button type="submit" id="join-room" disabled>Войти</button>
        </div>

        <p id="menu-error" role="alert"></p>

        <div class="menu-footer">
          <button type="button" id="fullscreen" hidden>На весь экран</button>
          <button type="button" id="sound-toggle">Звук: вкл</button>
        </div>
      </form>
    </div>

    <div id="rotate-hint">
      Поверни телефон горизонтально — так удобнее
      <button type="button" id="rotate-hint-close" aria-label="Закрыть">✕</button>
    </div>

    <div id="toast" role="status" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
